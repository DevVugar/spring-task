databaseChangeLog:
  - changeSet:
      id: Create Destination table
      author: Vugar
      changes:
        - createTable:
            tableName: destinations
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: location
                  type: VARCHAR(255)
              - column:
                  name: description
                  type: VARCHAR(255)


